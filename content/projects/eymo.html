<div class="eymo-container">
	<style>
		.eymo-container {
			max-width: 1000px;
			margin: 0 auto;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}
		
		.eymo-header {
			text-align: center;
			margin-bottom: 30px;
		}
		
		.eymo-start-button {
			background: #007bff;
			color: white;
			border: none;
			padding: 12px 24px;
			font-size: 16px;
			border-radius: 6px;
			cursor: pointer;
			transition: background 0.2s;
		}
		
		.eymo-start-button:hover {
			background: #0056b3;
		}
		
		.eymo-main {
			display: none;
		}
		
		.eymo-main.visible {
			display: block;
		}
		
		.eymo-loading {
			display: none;
			text-align: center;
			padding: 40px;
			font-size: 18px;
			color: #666;
		}
		
		.eymo-loading.visible {
			display: block;
		}
		
		.eymo-spinner {
			display: inline-block;
			width: 20px;
			height: 20px;
			border: 3px solid #f3f3f3;
			border-top: 3px solid #007bff;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-right: 10px;
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		.eymo-canvas-container {
			text-align: center;
			margin-bottom: 30px;
		}
		
		#canvas {
			border: 2px solid #ddd;
			border-radius: 8px;
			max-width: 100%;
			height: auto;
		}
		
		.eymo-controls {
			display: grid;
			gap: 20px;
			margin-bottom: 30px;
		}
		
		.eymo-command-section {
			background: #f8f9fa;
			padding: 20px;
			border-radius: 8px;
			border: 1px solid #e9ecef;
		}

		.print-container {
			display: flex;
			justify-content: center;
	  	align-items: center;
  		margin-bottom: 1rem;
		}

		#print {
		  width: 8rem;
		}
		
		.eymo-command-label {
			display: block;
			font-weight: 600;
			margin-bottom: 8px;
			color: #333;
		}
		
		#cmd {
			width: 100%;
			min-height: 100px;
			padding: 12px;
			border: 1px solid #ddd;
			border-radius: 6px;
			font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
			font-size: 14px;
			resize: vertical;
			background: white;
		}
		
		#cmd:focus {
			outline: none;
			border-color: #007bff;
			box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
		}
		
		.eymo-buttons {
			display: flex;
			gap: 12px;
			justify-content: center;
			flex-wrap: wrap;
		}
		
		.eymo-button {
			padding: 10px 20px;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			font-weight: 500;
			transition: all 0.2s;
		}
		
		.eymo-button.primary {
			background: #28a745;
			color: white;
		}
		
		.eymo-button.primary:hover {
			background: #218838;
		}
		
		.eymo-button.secondary {
			background: #6c757d;
			color: white;
		}
		
		.eymo-button.secondary:hover {
			background: #545b62;
		}
		
		.eymo-button.danger {
			background: #dc3545;
			color: white;
		}
		
		.eymo-button.danger:hover {
			background: #c82333;
		}
		
		.eymo-sample-configs {
			background: #f8f9fa;
			padding: 20px;
			border-radius: 8px;
			border: 1px solid #e9ecef;
			margin-bottom: 20px;
		}
		
		.eymo-sample-label {
			display: block;
			font-weight: 600;
			margin-bottom: 12px;
			color: #333;
		}
		
		.eymo-sample-buttons {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 10px;
		}
		
		.eymo-sample-button {
			background: #17a2b8;
			color: white;
			border: none;
			padding: 8px 16px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 13px;
			font-weight: 500;
			transition: all 0.2s;
		}
		
		.eymo-sample-button:hover {
			background: #138496;
		}
		
		@media (max-width: 768px) {
			.eymo-container {
				padding: 10px;
			}
			
			.eymo-buttons {
				flex-direction: column;
			}
			
			.eymo-button {
				width: 100%;
			}
		}
	</style>
	
	<div class="eymo-header" id="start-container">
		<button id="start" class="eymo-start-button">Load Eymo</button>
	</div>
	
	<div id="loading" class="eymo-loading">
		<div class="eymo-spinner"></div>
		Loading Eymo WASM module...
	</div>
	
	<div id="main" class="eymo-main">
		<div class="eymo-canvas-container">
			<canvas id="canvas" width="640" height="480"></canvas>
		</div>

		<div class="print-container">
			<button id="print" class="eymo-button primary">Print!</button>
		</div>
		
		<div class="eymo-controls">
			<div class="eymo-sample-configs">
				<label class="eymo-sample-label">Sample Configurations:</label>
				<div id="sample-buttons" class="eymo-sample-buttons">
					<!-- Sample buttons will be generated by JavaScript -->
				</div>
			</div>
			
			<div class="eymo-command-section">
				<label for="cmd" class="eymo-command-label">Eymo Command:</label>
				<textarea id="cmd" placeholder="Enter your Eymo commands here..."></textarea>
			</div>
			
			<div class="eymo-buttons">
				<button id="submit" class="eymo-button primary">Update Command</button>
				<button id="play" class="eymo-button secondary">Play</button>
				<button id="stop" class="eymo-button danger">Stop</button>
			</div>
		</div>
	</div>

	<script type="module" src="./init.js" />

</div>
